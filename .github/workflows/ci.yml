name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24, 26]
        exclude:
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 24
          - os: windows-latest
            node: 26
          - os: macos-latest
            node: 20
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:security
      - run: npm run test:storage
      - run: npm run test:doctor

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install npm 12 for acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/npm12" --ignore-scripts npm@12
          echo "$RUNNER_TEMP/npm12/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify npm 12 install policy
        run: node -e "const major=Number(require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.')[0]); if(major!==12) throw new Error('Expected npm 12, got '+major)"
      - run: npm ci
      - run: npm run qa
      - run: npm run test:plugin
      - run: npm pack --dry-run
